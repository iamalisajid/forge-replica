[project]
name = "forge"
version = "0.1.0"
description = "Turn a web app URL into an independently runnable full-stack replica, verified against the original."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.14",
    "claude-agent-sdk==0.2.167",
    "playwright==1.63.0",
    "pydantic>=2.14,<3",
    "typer>=0.27",
    "genson>=1.4",
    "pyyaml>=6.0",
    "cryptography>=50",
    "httpx>=0.28",
]

[project.scripts]
forge = "forge.cli:app"

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: calls the Anthropic API and spends money",
    "docker: needs a running Docker daemon",
]
addopts = "-m 'not live'"
